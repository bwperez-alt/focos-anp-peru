name: Focos 2020–hoy – carga histórica (FIRMS)

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha inicial (AAAA-MM-DD)"
        default: "2020-01-01"
      hasta:
        description: "Fecha final (AAAA-MM-DD, vacío = hoy)"
        default: ""
  schedule:
    # día 5 de cada mes: rehace los últimos 4 meses para reemplazar NRT por el producto estándar (SP)
    - cron: "17 10 5 * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reanudar descargas previas
        uses: actions/cache@v4
        with:
          path: data/tmp_firms
          key: firms-${{ github.run_id }}
          restore-keys: firms-
      - name: Descargar y procesar
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/backfill_firms.py --meses-atras 4
          else
            python scripts/backfill_firms.py --desde "${{ inputs.desde }}" ${{ inputs.hasta && format('--hasta {0}', inputs.hasta) || '' }}
          fi
      - name: Guardar la serie histórica
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archivo/focos_historico
          git diff --cached --quiet || git commit -m "Focos históricos FIRMS: $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
      - name: Publicar de inmediato
        run: gh workflow run actualizar.yml
        env:
          GH_TOKEN: ${{ github.token }}
