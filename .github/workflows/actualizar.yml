name: Actualizar observatorio y publicar

on:
  schedule:
    - cron: "23 * * * *"     # cada hora (minuto 23, UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/index.html", "docs/img/**", "scripts/**", "data/base/**", "data/entrada/**", ".github/workflows/actualizar.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar las últimas salidas publicadas
        uses: actions/cache/restore@v4
        with:
          path: docs/data
          key: salidas-${{ github.run_id }}
          restore-keys: salidas-

      - name: Ejecutar módulos (fuego, aire, deforestación, emergencias y sismos, ecoturismo)
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: python scripts/actualizar.py

      - name: Guardar salidas para la próxima corrida
        if: always()
        uses: actions/cache/save@v4
        with:
          path: docs/data
          key: salidas-${{ github.run_id }}

      - name: Guardar la serie histórica en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archivo data/base docs/data/deforestacion.json docs/data/deforestacion_rejilla.geojson 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Datos: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done || echo "No se pudo guardar (se reintentará)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
