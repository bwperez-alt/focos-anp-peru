name: Actualizar observatorio y publicar

on:
  schedule:
    - cron: "23 * * * *"     # cada hora (minuto 23, UTC)
  # Respaldo: un servicio externo (cron-job.org, Cloudflare Worker) llama cada hora a
  # POST /repos/bwperez-alt/focos-anp-peru/dispatches {"event_type":"actualizar"}
  # porque el cron de GitHub puede retrasarse u omitir corridas en horas de alta carga.
  repository_dispatch:
    types: [actualizar]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/index.html", "docs/img/**", "scripts/**", "data/base/**", "data/entrada/**", ".github/workflows/actualizar.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar las últimas salidas publicadas
        uses: actions/cache/restore@v4
        with:
          path: docs/data
          key: salidas-${{ github.run_id }}
          restore-keys: salidas-

      - name: Ejecutar módulos (fuego, aire, deforestación, emergencias y sismos, ecoturismo)
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python scripts/actualizar.py

      - name: Validar salidas antes de publicar
        run: python scripts/validar.py

      - name: Guardar salidas para la próxima corrida
        if: always()
        uses: actions/cache/save@v4
        with:
          path: docs/data
          key: salidas-${{ github.run_id }}

      - name: Guardar la serie histórica en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data/archivo data/base docs/data/deforestacion.json docs/data/deforestacion_rejilla.geojson; do
            if [ -e "$p" ]; then git add -A "$p"; fi
          done
          git diff --cached --quiet || git commit -m "Datos: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done || echo "No se pudo guardar (se reintentará)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Vigilar la frescura del dato de fuego (avisa por correo si falla)
        run: python scripts/validar.py --frescura
