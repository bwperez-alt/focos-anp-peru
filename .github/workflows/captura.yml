name: Captura para video (temporal)
on:
  push:
    branches: [sonda-firms]
    paths: [captura.py, .github/workflows/captura.yml]
permissions:
  contents: write
jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python captura.py
      - name: Guardar capturas en esta rama
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capturas && git commit -m "Capturas" && git push
